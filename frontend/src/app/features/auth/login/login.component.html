<div class="auth-card">
  <h1>Sign in</h1>

  <p class="session-expired" *ngIf="sessionExpiredMessage">{{ sessionExpiredMessage }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="usernameOrEmail">Username or email</label>
    <input id="usernameOrEmail" type="text" formControlName="usernameOrEmail" autocomplete="username" />

    <label for="password">Password</label>
    <div class="password-row">
      <input
        id="password"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()">
        {{ showPassword ? 'Hide' : 'Show' }}
      </button>
    </div>

    <p class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <button type="submit" class="submit-button" [disabled]="submitting">
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
</div>
