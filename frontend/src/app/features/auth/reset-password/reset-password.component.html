<div class="auth-card">
  <h1>Reset password</h1>

  <ng-container *ngIf="!success; else done">
    <form *ngIf="token" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />

      <p class="hint">Minimum 8 characters.</p>

      <p class="error-message" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched" role="alert">
        Passwords do not match.
      </p>

      <p class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <button type="submit" class="submit-button" [disabled]="submitting">
        {{ submitting ? 'Resetting…' : 'Set new password' }}
      </button>
    </form>

    <ng-container *ngIf="!token">
      <p class="error-message" role="alert">{{ errorMessage }}</p>
      <a routerLink="/forgot-password">Request a new link</a>
    </ng-container>
  </ng-container>

  <ng-template #done>
    <p class="confirmation-message">Your password has been reset. Please log in with your new password.</p>
    <button type="button" class="submit-button" (click)="goToLogin()">Go to login</button>
  </ng-template>
</div>
