<div class="patient-form-card" *ngIf="!loading; else loadingBlock">
  <h1>Edit Patient</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="fullName">Full name *</label>
    <input id="fullName" type="text" formControlName="fullName" />
    <p class="field-error" *ngIf="form.controls.fullName.touched && form.controls.fullName.invalid">
      Full name is required.
    </p>

    <fieldset class="dob-toggle">
      <legend>Date of birth or age *</legend>
      <label>
        <input type="radio" name="dobMode" [checked]="dobMode === 'dob'" (change)="setDobMode('dob')" />
        Date of birth
      </label>
      <label>
        <input type="radio" name="dobMode" [checked]="dobMode === 'age'" (change)="setDobMode('age')" />
        Age (approximate)
      </label>
    </fieldset>

    <ng-container *ngIf="dobMode === 'dob'; else ageInput">
      <label for="dateOfBirth">Date of birth</label>
      <input id="dateOfBirth" type="date" formControlName="dateOfBirth" />
    </ng-container>
    <ng-template #ageInput>
      <label for="approxAgeAtEntry">Age (years)</label>
      <input id="approxAgeAtEntry" type="number" min="0" max="150" formControlName="approxAgeAtEntry" />
    </ng-template>
    <p class="field-error" *ngIf="fieldErrors['dateOfBirth']">{{ fieldErrors['dateOfBirth'] }}</p>
    <p class="field-error" *ngIf="fieldErrors['approxAgeAtEntry']">{{ fieldErrors['approxAgeAtEntry'] }}</p>

    <label for="gender">Gender *</label>
    <select id="gender" formControlName="gender">
      <option value="" disabled>Select gender</option>
      <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
    </select>
    <p class="field-error" *ngIf="form.controls.gender.touched && form.controls.gender.invalid">
      Gender is required.
    </p>

    <label for="phoneNumber">Phone number *</label>
    <input id="phoneNumber" type="tel" formControlName="phoneNumber" />
    <p class="field-error" *ngIf="form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid">
      Enter a valid phone number.
    </p>
    <p class="field-error" *ngIf="fieldErrors['phoneNumber']">{{ fieldErrors['phoneNumber'] }}</p>

    <label for="email">Email (optional)</label>
    <input id="email" type="email" formControlName="email" />

    <label for="address">Address (optional)</label>
    <textarea id="address" formControlName="address" rows="2"></textarea>

    <p class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <div class="form-actions">
      <button type="submit" class="submit-button" [disabled]="submitting">
        {{ submitting ? 'Saving…' : 'Save' }}
      </button>
      <a [routerLink]="['/patients', patientId]" class="cancel-link">Cancel</a>
    </div>
  </form>
</div>

<ng-template #loadingBlock>
  <p>Loading patient…</p>
</ng-template>
