@if (isAuthenticated()) {
  <header class="app-header">
    <a routerLink="/dashboard" class="app-title">Patient Management</a>
    <nav class="app-nav" aria-label="Primary">
      <a routerLink="/patients" routerLinkActive="active-tab" class="nav-tab">Patients</a>
      <a routerLink="/appointments" routerLinkActive="active-tab" class="nav-tab">Appointments</a>
    </nav>
    <app-search-widget></app-search-widget>
    <div class="header-actions">
      <button type="button" class="logout-button" (click)="logout()">Logout</button>
    </div>
  </header>
}
