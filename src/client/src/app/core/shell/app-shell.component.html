@if (isAuthenticated()) {
  <header class="app-header sticky top-0 z-20 flex items-center gap-6 px-6 py-3 bg-white border-b border-slate-200 shadow-sm">
    <a routerLink="/dashboard" class="flex items-center gap-2.5 no-underline cursor-pointer">
      <span class="h-9 w-9 rounded-lg bg-[#eef2f9] border border-[#dbe4f3] flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#2c4568]">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"></path>
        </svg>
      </span>
      <span class="font-bold text-base text-slate-900 tracking-tight hidden sm:inline">Patient Management</span>
    </a>
    <nav class="flex gap-1 flex-1" aria-label="Primary">
      <a
        routerLink="/patients"
        routerLinkActive="rla-active"
        #patientsRla="routerLinkActive"
        class="nav-tab text-sm font-medium no-underline py-2 px-3.5 rounded-lg transition-colors"
        [class.text-slate-500]="!patientsRla.isActive"
        [class.hover:text-slate-900]="!patientsRla.isActive"
        [class.hover:bg-slate-50]="!patientsRla.isActive"
        [class.text-[#1e3a5f]]="patientsRla.isActive"
        [class.bg-[#eef2f9]]="patientsRla.isActive"
        [class.font-semibold]="patientsRla.isActive"
      >
        Patients
      </a>
      <a
        routerLink="/appointments"
        routerLinkActive="rla-active"
        #appointmentsRla="routerLinkActive"
        class="nav-tab text-sm font-medium no-underline py-2 px-3.5 rounded-lg transition-colors"
        [class.text-slate-500]="!appointmentsRla.isActive"
        [class.hover:text-slate-900]="!appointmentsRla.isActive"
        [class.hover:bg-slate-50]="!appointmentsRla.isActive"
        [class.text-[#1e3a5f]]="appointmentsRla.isActive"
        [class.bg-[#eef2f9]]="appointmentsRla.isActive"
        [class.font-semibold]="appointmentsRla.isActive"
      >
        Appointments
      </a>
    </nav>
    <app-search-widget></app-search-widget>
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="logout-button py-2 px-4 bg-white text-slate-700 border border-slate-300 rounded-lg text-sm font-medium cursor-pointer shadow-sm transition-colors hover:bg-slate-50 hover:border-slate-400"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </header>
}
