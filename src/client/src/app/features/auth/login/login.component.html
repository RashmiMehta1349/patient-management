<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Patient Management</h1>
    <h2>Sign in</h2>

    @if (sessionExpiredMessage) {
      <div class="banner banner-info" role="status">{{ sessionExpiredMessage }}</div>
    }

    @if (errorMessage) {
      <div class="banner banner-error" role="alert">{{ errorMessage }}</div>
    }

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />

    <label for="password">Password</label>
    <div class="relative">
      <input
        id="password"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        class="w-full pr-10"
      />
      <button
        type="button"
        class="password-toggle absolute inset-y-0 right-2 flex items-center text-slate-400 hover:text-slate-600 bg-transparent border-0 p-0 m-0 shadow-none"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
        tabindex="-1"
      >
        @if (passwordVisible()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.06 21.06 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.06 21.06 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        }
      </button>
    </div>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>

    <a class="forgot-link" routerLink="/forgot-password">Forgot password?</a>
  </form>
</div>
