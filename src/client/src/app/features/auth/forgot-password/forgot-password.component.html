<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-slate-50 to-slate-100">
  <div class="w-full max-w-[400px] bg-white rounded-2xl shadow-lg shadow-slate-200/60 border border-slate-200 p-8 sm:p-10 flex flex-col gap-1.5">
    <div class="mb-2 flex justify-center">
      <div class="h-11 w-11 rounded-xl bg-[#eef2f9] border border-[#dbe4f3] flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#2c4568]">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"></path>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-bold mt-0 mb-0.5 text-slate-900 tracking-tight text-center">Patient Management</h1>
    <h2 class="text-sm font-medium mt-0 mb-6 text-slate-500 text-center">Forgot password</h2>

    @if (submitted) {
      <div class="py-3 px-4 rounded-xl text-sm mb-3 font-medium bg-emerald-50 text-emerald-700 border border-emerald-100" role="status">
        If that email is registered, a reset link has been sent.
      </div>
      <a
        class="mt-4 text-sm text-[#2c4568] text-center no-underline font-medium hover:text-[#1e3a5f] hover:underline"
        routerLink="/login"
      >
        Back to sign in
      </a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label for="email" class="text-sm font-medium text-slate-700 mt-2.5">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full py-2.5 px-3.5 mt-1.5 border border-slate-300 rounded-xl text-sm text-slate-900 shadow-sm transition-colors placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3d5a80] focus:border-[#3d5a80]"
          placeholder="you@clinic.com"
        />

        <button
          type="submit"
          [disabled]="submitting"
          class="w-full mt-6 py-2.5 px-4 bg-[#2c4568] text-white border-0 rounded-xl text-sm font-semibold cursor-pointer shadow-sm transition-colors hover:bg-[#1e3a5f] focus:outline-none focus:ring-2 focus:ring-[#3d5a80] focus:ring-offset-2 disabled:opacity-60 disabled:cursor-default disabled:hover:bg-[#2c4568]"
        >
          {{ submitting ? 'Sending…' : 'Send reset link' }}
        </button>

        <a
          class="mt-4 text-sm text-[#2c4568] text-center no-underline font-medium hover:text-[#1e3a5f] hover:underline"
          routerLink="/login"
        >
          Back to sign in
        </a>
      </form>
    }
  </div>
</div>
