<div class="auth-page">
  <div class="auth-card" *ngIf="linkInvalid">
    <h1>Link no longer valid</h1>
    <p>This password reset link is no longer valid. Please request a new one.</p>
    <a routerLink="/forgot-password" class="forgot-link">Request a new link</a>
  </div>

  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate *ngIf="!linkInvalid">
    <h1>Set new password</h1>

    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />

    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />

    <p class="error-message" *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched">
      Passwords do not match.
    </p>
    <p
      class="error-message"
      *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['minlength']"
    >
      Password must be at least 8 characters long.
    </p>
    <p class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Submitting…' : 'Submit' }}
    </button>
  </form>
</div>
