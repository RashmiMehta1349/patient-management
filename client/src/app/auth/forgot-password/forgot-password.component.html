<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate *ngIf="!confirmationMessage">
    <h1>Forgot password</h1>
    <p>Enter your registered email and we'll send you a reset link.</p>

    <label for="email">Email</label>
    <input id="email" type="text" formControlName="email" autocomplete="username" />

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Submitting…' : 'Submit' }}
    </button>

    <a routerLink="/login" class="forgot-link">Back to login</a>
  </form>

  <div class="auth-card" *ngIf="confirmationMessage">
    <p class="info-message">{{ confirmationMessage }}</p>
    <a routerLink="/login" class="forgot-link">Back to login</a>
  </div>
</div>
